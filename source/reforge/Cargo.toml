[workspace]
resolver = "3"
members = ["protocol", "network", "database", "game_core", "server_realms", "mysql_proxy", "locale_import", "bench_bot", "quest_dsl", "admin_tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "test-util"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
# Pool compartido de conexiones PG (fix del cuello del entry 2026-08-13):
# deadpool-postgres 0.14.1 depende de tokio-postgres 0.7.9 (verificado en el
# Cargo.toml del crate descargado — MISMO driver que el workspace, sin subir).
deadpool-postgres = { version = "0.14" }
uuid = "1"
# ADR-0010 §2: bevy_ecs standalone — default-features = false (sin
# bevy_reflect; std sí — el runtime es std). SOLO ["std"] (sin bevy_tasks):
# `Schedule::default()` usa el executor single-thread (ecs/world.rs:83-93) y
# los sistemas van `.chain()` secuenciales. El paralelismo ECS es una decisión
# PENDIENTE del benchmark (ADR-0010 corregido 2026-08-13) — NO hay toggle.
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
