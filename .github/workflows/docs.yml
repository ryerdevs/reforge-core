name: docs

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - name: Verify workspace
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify.ps1
      - name: Documentation metadata gate (G1.18)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/check_docs.ps1
      - name: Status snapshot
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/status.ps1
      - name: Handoff check — source changed without progress/CHANGELOG/registry
        shell: pwsh
        run: |
          $changed = @(git diff --name-only origin/main...HEAD)
          $touchedSource = $changed | Select-String "source/reforge"
          $requiredHandoff = @(
            "documentation/progress.md",
            "CHANGELOG.md",
            "documentation/plans/gap-registry.md"
          )
          $missingHandoff = @($requiredHandoff | Where-Object { $_ -notin $changed })
          if ($touchedSource -and $missingHandoff.Count -gt 0) {
            Write-Error "source/reforge touched but required handoff files are missing: $($missingHandoff -join ', ')"
            exit 1
          }
          Write-Host "handoff check ok"
      - name: Gap-registry sanity
        shell: pwsh
        run: |
          $rows = Select-String -Path documentation/plans/gap-registry.md -Pattern '^\| G[0-9]' | ForEach-Object { $_.Line }
          $openRows = $rows | Where-Object { $_ -notmatch 'CLOSED' -and $_ -notmatch '~~' }
          Write-Host "registry has $($openRows.Count) open rows (gate 2 backlog, expected: many)"
      - name: Build admin_tui (deploy operator TUI)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_admin_tui.ps1
          $bin = "source/deploy/win/admin_tui.exe"
          if (-not (Test-Path $bin)) {
            Write-Error "admin_tui.exe was not copied to deploy/win"
            exit 1
          }
          Write-Host "admin_tui in deploy/win: $((Get-Item $bin).Length) bytes"
      - name: Link checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress documentation/**/*.md

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@v4
